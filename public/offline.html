<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline — My Okane</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1b1718;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
      text-align: center;
    }
    .icon {
      width: 48px;
      height: 48px;
      margin-bottom: 1rem;
      border-radius: 12px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #a8a29e;
      max-width: 400px;
      line-height: 1.5;
      margin: 0 0 1.5rem 0;
    }
    button {
      padding: 0.65rem 1.4rem;
      background: #4ade80;
      color: #1b1718;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #86efac;
    }
  </style>
</head>
<body>
  <img src="/pwa-192x192.png" alt="My Okane" class="icon">
  <h1>You're Offline</h1>
  <p>My Okane can't reach the server while offline. Cached data remains accessible, and changes will sync once connection is restored.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
